# Free web service; no disk, payment method or continuously running worker.
services:
  - type: web
    name: gpt1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_OWNER_ID
        sync: false
      - key: TG_BOT_USERNAME
        value: frodgrambot
      - key: TG_USER_SESSION
        sync: false
      - key: DATA_DIR
        value: /tmp/media-data
      - key: MAX_FILE_MB
        value: "500"
