# Creates paid resources only after the owner reviews and applies this Blueprint.
services:
  - type: worker
    name: gpt1
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    numInstances: 1
    disk:
      name: media-data
      mountPath: /data
      sizeGB: 3
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_OWNER_ID
        sync: false
      - key: TG_BOT_USERNAME
        value: frodgrambot
      - key: TG_USER_SESSION
        sync: false
      - key: DATA_DIR
        value: /data
      - key: MAX_FILE_MB
        value: "1900"
